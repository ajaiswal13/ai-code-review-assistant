services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-review-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_review_db
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_review_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    container_name: ai-review-backend
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      DB_HOST: postgres
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: